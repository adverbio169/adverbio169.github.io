<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expoferr 2025 Setor 1 em 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: canvas 3D em tela cheia; barra de título no topo, busca e legenda flutuantes, ficha do estande embaixo.
   Visual único (maquete diurna) por escolha: cores explícitas, sem variação de tema. */
:root{
  --ground:#e9e4d2; --ink:#1f2a1c; --muted:#5d6656; --panel:rgba(255,253,246,.94);
  --line:#d6cfb6; --accent:#f2b705; --accent-ink:#3a2c00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--panel),rgba(255,253,246,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:auto;min-width:0}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.01em;text-wrap:balance}
.brand b em{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 .25em;border-radius:3px}
.brand span{font-size:.78rem;color:var(--muted);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;flex-wrap:wrap}
input,button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:#fffdf6;color:var(--ink);border-radius:8px;padding:7px 10px}
button{cursor:pointer;font-weight:600}
button:hover{background:#fff4cc}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{width:11rem}
.legend{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.78rem;max-width:15rem}
.legend h2{font-family:var(--display);font-size:.95rem;margin:0 0 6px;letter-spacing:.06em;text-transform:uppercase}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.legend li{display:flex;gap:7px;align-items:center}
.legend i{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.25);flex:none}
#legToggle{display:none}
.card{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:min(19rem,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,#999);
  border-radius:10px;padding:12px 14px}
.card .num{font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.card .name{font-weight:600;font-size:1.05rem;margin-top:2px}
.card .cat{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.card .x{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:1.1rem;padding:4px 8px}
.hint{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);
  font-size:.75rem;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px}
#msg{position:fixed;z-index:7;left:50%;top:40%;transform:translateX(-50%);background:var(--panel);padding:12px 16px;border-radius:10px;border:1px solid var(--line)}
@media (max-width:640px){
  .brand b{font-size:1.3rem}
  #q{width:8.5rem}
  .legend{max-width:calc(100% - 32px)}
  .legend ul{display:none}
  .legend.open ul{display:grid;grid-template-columns:1fr 1fr}
  .legend h2{margin:0}
  #legToggle{display:inline}
  .legend{cursor:pointer}
  .hint{display:none}
  .card{bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
}
</style>

<div id="scene" aria-label="Maquete 3D do Setor 1 de Negócios da Expoferr 2025"></div>

<header class="top">
  <div class="brand"><b><em>44ª</em> Expoferr 2025</b><span>Setor 1 · Negócios · maquete 3D</span></div>

 [785,255,'Cavalos'],[770,298,'Moenda'],[798,335,'Gado'],[818,372,'Gado'],[795,412,'Gado'],[800,455,'Gado'],

/* Cena */
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#cfe3ea');
scene.fog=new THREE.Fog('#cfe3ea',1400,2600);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,6000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.47;controls.minDistance=60;controls.maxDistance=2200;

scene.add(new THREE.HemisphereLight('#ffffff','#9a8f6a',0.75));
const sun=new THREE.DirectionalLight('#fff3d6',0.85);
sun.position.set(-500,700,300);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-800,right:800,top:600,bottom:-600,near:10,far:2000});
scene.add(sun);

const P=(x,y)=>[x-660,y-455]; // pixel do croqui → cena
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const pickable=[];

// Chão
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1050),mat('#d9d3b8'));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),mat('#b7c79a'));
grass.rotation.x=-Math.PI/2;grass.position.y=-0.5;scene.add(grass);

// Vias
const road=mat('#8b8a83');
function strip(x1,y1,x2,y2,w){const [a,b]=P(x1,y1),[c,d]=P(x2,y2);const len=Math.hypot(c-a,d-b);
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,0.6,w),road);m.position.set((a+c)/2,0.3,(b+d)/2);
  m.rotation.y=-Math.atan2(d-b,c-a);m.receiveShadow=true;scene.add(m);}

  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const p=new THREE.Mesh(new THREE.CylinderGeometry(1,1,20,6),mat('#777'));p.position.set(x+Math.cos(a)*68,10,z+Math.sin(a)*68);scene.add(p);}

  m.userData={n:'WC',name:'Banheiro',cat:'wc'};scene.add(m);pickable.push(m);});

// Rótulos
function label(text,px,py,y,size,strong){const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
  const fs=48;ctx.font='700 '+fs+'px "Barlow Condensed", Arial Narrow, sans-serif';const w=Math.ceil(ctx.measureText(text).width)+24;
  cv.width=w;cv.height=fs+20;ctx.font='700 '+fs+'px "Barlow Condensed", Arial Narrow, sans-serif';
  ctx.fillStyle=strong?'rgba(31,42,28,.88)':'rgba(255,253,246,.9)';ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(0,0,cv.width,cv.height,12);else ctx.rect(0,0,cv.width,cv.height);ctx.fill();
  ctx.fillStyle=strong?'#fff':'#1f2a1c';ctx.textBaseline='middle';ctx.fillText(text,12,cv.height/2+2);
  const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  const h=size;sp.scale.set(h*cv.width/cv.height,h,1);const [x,z]=P(px,py);sp.position.set(x,y,z);sp.renderOrder=10;scene.add(sp);return sp;}
const numLabels=[];
function buildLabels(){
  [['SEBRAE',540,370,50],['Área das Concessionárias',690,290,24],['Arena do Leilão',1022,255,36],['IATER',1180,460,30],
   ['Arena de Alimentação',1172,725,24],['Agricultura Familiar',1162,545,24],['Entrada principal',290,160,22],
   ['Entrada autoridades',40,850,18],['Área serviços · máquinas',260,560,22]].forEach(a=>label(a[0],a[1],a[2],a[3],13,true));
  S.forEach(s=>{if(!s.n||s.n.startsWith('C'))return;numLabels.push(label(s.n,s.x,s.y,s.h+(s.h>=7?10:9),7,false));});
  ['Mitsubishi','Ford','BV Loc.','R Motors','Fiat','Nissan','Renault','Yamaha','Chevrolet'].forEach((m,i)=>numLabels.push(label(m,740,312+i*18.5,10,6,false)));
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(buildLabels);

// Câmera
const target0=new THREE.Vector3(40,0,10);
function view(kind){
  if(kind==='top'){camera.position.set(40,1300,11);}else{camera.position.set(-380,640,820);}
  controls.target.copy(target0);controls.update();}
view(innerWidth<640?'top':'persp');
if(innerWidth<640){camera.position.set(40,1700,11);controls.update();}
document.getElementById('top').onclick=()=>view('top');
document.getElementById('reset').onclick=()=>view('persp');

// Seleção
const card=document.getElementById('card'),ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let sel=null,selEmis=null;
function select(obj){
  if(sel){sel.material.emissive&&sel.material.emissive.setHex(selEmis);}
  sel=obj;if(!obj){card.hidden=true;return;}
  obj.material=obj.material.clone();selEmis=obj.material.emissive.getHex();obj.material.emissive.setHex(0x553300);
  const u=obj.userData;card.style.setProperty('--c',CAT[u.cat].c);
  document.getElementById('cNum').textContent=u.n?(u.n.startsWith('C')?'Concessionária':'Nº '+u.n):'Área';
  document.getElementById('cName').textContent=u.name;document.getElementById('cCat').textContent=CAT[u.cat].n;card.hidden=false;}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickable)[0];select(hit?hit.object:null);});
document.getElementById('close').onclick=()=>select(null);

// Busca
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^0+(?=\d)/,'');}
let fly=null;
function search(){const q=norm(document.getElementById('q').value.trim());if(!q)return;
  const m=pickable.find(o=>o.userData.n&&norm(o.userData.n)===q)||pickable.find(o=>norm(o.userData.name).includes(q));
  if(!m){card.hidden=false;card.style.setProperty('--c','#999');document.getElementById('cNum').textContent='—';
    document.getElementById('cName').textContent='Nada encontrado para "'+document.getElementById('q').value+'"';document.getElementById('cCat').textContent='Tente o número ou parte do nome';return;}
  select(m);const t=m.position.clone();t.y=0;
  const off=new THREE.Vector3(-90,170,180);fly={t0:performance.now(),fromT:controls.target.clone(),fromP:camera.position.clone(),toT:t,toP:t.clone().add(off)};}
document.getElementById('go').onclick=search;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(now){requestAnimationFrame(loop);
  if(fly){let k=reduce?1:Math.min(1,(now-fly.t0)/900);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(fly.fromT,fly.toT,k);camera.position.lerpVectors(fly.fromP,fly.toP,k);if(k>=1)fly=null;}
  const d=camera.position.distanceTo(controls.target);numLabels.forEach(l=>l.visible=d<900);
  controls.update();renderer.render(scene,camera);})();
})();
</script>
